on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust & Target
        run: |
          rustup target add aarch64-apple-ios

      - name: Download game.zip
        run: |
          curl -L -o game.zip "https://files.catbox.moe/857dm2.zip"

      - name: Build Muguet iOS IPA
        run: |
          chmod +x ./make-ios.sh
          ./make-ios.sh game.zip --ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muguet-IPA
          path: "*.ipa"
          if-no-files-found: error"

      - name: Build Muguet iOS IPA
        run: |
          chmod +x ./make-ios.sh
          ./make-ios.sh game.zip --ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muguet-IPA
          path: "*.ipa"
          if-no-files-found: error
